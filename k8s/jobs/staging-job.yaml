apiVersion: batch/v1
kind: Job

metadata:
  name: playwright-job
  namespace: staging

spec:
  backoffLimit: 2

  template:
    metadata:
      labels:
        app: playwright-demo
        env: staging

    spec:
      restartPolicy: Never

      volumes:
      - name: playwright-project
        hostPath:
          path: /root/k8s-playwright-basic-setup
          type: Directory

      containers:
      - name: playwright

        image: mcr.microsoft.com/playwright:v1.55.0-jammy
        imagePullPolicy: Always

        workingDir: /app

        volumeMounts:
        - name: playwright-project
          mountPath: /app

        envFrom:
        - configMapRef:
            name: nginx-config
        - secretRef:
            name: nginx-secret

        command:
        - sh
        - -c

        args:
        - |
          pwd
          ls -la
          npm ci
          npx playwright test