apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  namespace: prod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: playwright-demo
      env: prod

  template:
    metadata:
      labels:
        app: playwright-demo
        env: prod

    spec:
      containers:
      - name: nginx
        image: nginx:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80

        envFrom:
        - configMapRef:
            name: nginx-config

        - secretRef:
            name: nginx-secret
